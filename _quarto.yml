project:
  type: book

book:
  title: "Clustering and classification for paediatric mTBI"
  output-file: "pv_phd"
  author: "Prashanth Velayudhan"
  date: "5/4/2022"
  search: true
  chapters:
    - part: "Home"
      chapters:
        - index.qmd
    - part: "Introduction"
      chapters:
        - introduction/mtbi.qmd
        - introduction/clustering.qmd
        - introduction/aims.qmd
    - part: "The PNC dataset"
      chapters:
        - pnc/pilot.qmd
    - part: "The ABCD dataset"
      chapters:
        - abcd/overview.qmd
        - abcd/eda.qmd
        - abcd/extract_transform.qmd
    - references.qmd
    - part: "Appendix"
      chapters:
        - appendix/scabcd_functions.qmd
        - appendix/race_breakdown.qmd
        - appendix/raw_summaries.qmd
        - appendix/coding_dummies.qmd
  repo-url: https://github.com/psvelayudhan/pv-phd-research
  repo-actions: [edit, issue]

bibliography: prashanth_zotcite.bib
filters:
  - zotref.py
csl: nature.xml

execute:
  eval: false
  freeze: auto
  warning: false
  message: false

format:
  html:
    theme: flatly
    code-fold: show
  pdf:
    documentclass: scrreprt
