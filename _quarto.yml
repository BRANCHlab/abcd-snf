project:
  type: book

book:
  title: "Clustering and classification for paediatric mTBI"
  number-sections: true
  output-file: "pv_phd"
  author: "Prashanth Velayudhan"
  date: "5/4/2022"
  chapters:
    - part: "Home"
      chapters:
        - index.qmd
    - part: "Introduction"
      chapters:
        - introduction/mtbi.qmd
        - introduction/clustering.qmd
        - introduction/aims.qmd
    - part: "The PNC dataset"
      chapters:
        - pnc/pilot.qmd
    - part: "The ABCD dataset"
      chapters:
        - abcd/overview.qmd
        - abcd/eda.qmd
        - abcd/extract_transform.qmd
        - abcd/inputs.qmd
        - abcd/snf.qmd
        - abcd/outcomes.qmd
        - abcd/bootstrapping.qmd
        - abcd/conclusion.qmd
    - references.qmd
  repo-url: https://github.com/psvelayudhan/pv-phd-research
  repo-actions: [edit, issue]

bibliography: prashanth_zotcite.bib
filters:
  - zotref.py
csl: nature.xml

execute:
  freeze: auto
  warning: false
  message: false

format:
  html:
    theme: flatly
    code-fold: show
  pdf:
    documentclass: scrreprt
