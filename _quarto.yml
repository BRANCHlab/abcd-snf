project:
  type: book

book:
  title: "Clustering and classification for paediatric mTBI"
  number-sections: true
  output-file: "pv_phd"
  author: "Prashanth Velayudhan"
  date: "5/4/2022"
  chapters:
    - part: "Home"
      chapters:
        - index.qmd
    - part: "Introduction"
      chapters:
        - pt1_introduction/mtbi.qmd
        - pt1_introduction/clustering.qmd
        - pt1_introduction/subtyping_mtbi.qmd
        - pt1_introduction/neuroimaging.qmd
        - pt1_introduction/hyp_aim_obj_rat.qmd
    - part: "Subtyping in the ABCD Study"
      chapters:
        - pt2_abcd/abcd.qmd
        - pt2_abcd/eda.qmd
        - pt2_abcd/neuroimaging.qmd
        - pt2_abcd/psych.qmd
        - pt2_abcd/methods.qmd
        - pt2_abcd/pilot.qmd
        - pt2_abcd/subjects.qmd
        - pt2_abcd/inputs.qmd
        - pt2_abcd/snf.qmd
        - pt2_abcd/outcomes.qmd
        - pt2_abcd/bootstrapping.qmd
        - pt2_abcd/conclusion.qmd
    - references.qmd
  repo-url: https://github.com/psvelayudhan/pv-phd-research
  repo-actions: [edit, issue]

bibliography: prashanth_zotcite.bib
filters:
  - zotref.py
csl: nature.xml

execute:
  freeze: auto

format:
  html:
    theme: flatly
    code-fold: true
  pdf:
    documentclass: scrreprt
